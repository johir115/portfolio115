  <section>
    <div class="container card my-2">
      <div class="row">
        <div class="col-lg-12">

          <form class="was-validated" action="" onsubmit="return validationjohir()">
            <h3 class="text-center my-3 fw-bold">Contact form</h3>
            <div class="mb-3">
              <label for="Name" class="form-label fw-bold">Name :</label>
              <input type="text" class="form-control" id="name" aria-describedby="NameHelp"
                placeholder="Enter Your Name" required>
            </div>

            <div class="mb-3">
              <label for="Email" class="form-label fw-bold">Email :</label>
              <input type="email" class="form-control" id="email" aria-describedby="EmailHelp"
                placeholder="Enter Your Gmail" required>
            </div>

            <div class="mb-3">
              <label for="Input" class="form-label fw-bold">Phone :</label>
              <input minlength="11" maxlength="11" type="tel" class="form-control" id="tel"
                placeholder="Enter Your Phone Number" required>
            </div>
            <div class="mb-3">
              <label for="Address" class="form-label fw-bold">Address :</label>
              <input type="text" class="form-control" id="address" placeholder="Enter Your Your Address">
            </div>
            <div class="mb-3">
              <label for="Message" class="form-label fw-bold">Message :</label>
              <textarea type="text" rows="5" class="form-control" id="message" placeholder="write message"></textarea>
            </div>
            <div class="text-center">
              <button type="submit" class="btn btn-primary w-50 my-3">Submit</button>
            </div>
          </form>

        </div>
      </div>


    </div>
  </section>
